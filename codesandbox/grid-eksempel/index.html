<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid · Et glimt af MDU</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Et glimt af MDU</h1>

  <!-- Alle kortene ligger i ét element med klassen "grid" -->
  <section class="grid">
    <article>
      <img src="billeder/1.webp" alt="Skitser af app-skærme omkring en mobil">
      <h2>Design</h2>
      <p>Skitser, prototyper og test.</p>
    </article>
    <article>
      <img src="billeder/2.webp" alt="Hænder på et tastatur med kode på skærmen">
      <h2>Kode</h2>
      <p>HTML, CSS og JavaScript.</p>
    </article>
    <article>
      <img src="billeder/3.webp" alt="Studerende, der snakker sammen ved et bord">
      <h2>UX</h2>
      <p>Giver det mening for brugeren?</p>
    </article>
    <article>
      <img src="billeder/4.webp" alt="Et bord med post-its og skitser fra en workshop">
      <h2>Content</h2>
      <p>Tekst, video og sociale medier.</p>
    </article>
    <article>
      <img src="billeder/5.webp" alt="Studerende bøjet over en prototype af pap">
      <h2>Projekter</h2>
      <p>Rigtige cases med virksomheder.</p>
    </article>
    <article>
      <img src="billeder/6.webp" alt="Et fyldt klasselokale med gruppearbejde">
      <h2>Praktik</h2>
      <p>10 uger i en virksomhed.</p>
    </article>
  </section>

  <script src="app.js"></script>
</body>
</html>
